name: Deploy AI Knowledge Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'AI_Knowledge_Explorer_Combined/ai-knowledge-explorer/dist-local/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: AI_Knowledge_Explorer_Combined/ai-knowledge-explorer/dist-local
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
